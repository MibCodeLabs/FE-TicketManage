<nav class="border-b border-slate-200 bg-white">
  <div class="mx-auto flex h-20  items-center justify-between px-4 sm:px-6 lg:px-8">
    <a routerLink="/home" class="flex items-center rounded-xl border-2 border-green-500 px-1 py-2">
      <img src="/favicon.svg" class="h-8 w-8" alt="SupportManage logo" />

      <span class="text-xl font-bold tracking-tight text-slate-900">
        SupportManage
      </span>
    </a>

    <div class="flex items-center gap-3">

      <img [src]="profileUrl()" alt="Profile picture" class="h-9 w-9 rounded-full object-cover" />

      <div class="hidden sm:block">
        <p class="text-sm font-medium text-slate-900">
          {{fullName()}}
        </p>

        <p class="text-xs text-slate-500">
            {{role()}}
          </p>
      </div>

      <button (click)="logout()" type="button" class="ml-2 rounded-lg px-3 py-2 text-sm font-medium text-slate-600
           transition hover:bg-red-50 hover:text-red-600">
        Logout
      </button>

    </div>

  </div>
</nav>
