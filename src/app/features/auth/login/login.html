<div class="min-h-screen bg-slate-50 flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <!-- Header -->
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold tracking-tight text-slate-900">
        Welcome back
      </h1>

      <p class="mt-2 text-sm text-slate-500">
        Sign in to your account to continue
      </p>
    </div>

    <!-- Card -->
    <div class="rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
      <form class="space-y-5">

        <!-- Email -->
        <div>
          <label for="email" class="mb-2 block text-sm font-medium text-slate-700">
            Email
          </label>

          <input id="email" type="email" placeholder="you@example.com" class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-sm
               text-slate-900 placeholder:text-slate-400
               outline-none transition
               focus:border-green-500 focus:ring-2 focus:ring-green-500/20" />
        </div>

        <!-- Password -->
        <div>
          <div class="mb-2 flex items-center justify-between">
            <label for="password" class="block text-sm font-medium text-slate-700">
              Password
            </label>

            <a href="#" class="text-sm font-medium text-green-600 hover:text-green-700">
              Forgot password?
            </a>
          </div>

          <input id="password" type="password" placeholder="••••••••" class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-sm
               text-slate-900 placeholder:text-slate-400
               outline-none transition
               focus:border-green-500 focus:ring-2 focus:ring-green-500/20" />
        </div>

        <!-- Submit -->
        <button type="button" (click)="login()" class="w-full rounded-lg bg-green-600 px-4 py-2.5
             text-sm font-semibold text-white
             transition hover:bg-green-700
             focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2">
          Sign in
        </button>

      </form>

      <!-- Register -->
      <p class="mt-6 text-center text-sm text-slate-500">
        Don't have an account?

        <a routerLink="/register" class="font-medium text-green-600 hover:text-green-700">
          Create one
        </a>
      </p>
    </div>

  </div>
</div>
