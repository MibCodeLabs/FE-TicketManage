<div class="min-h-screen bg-slate-50 flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <!-- Header -->
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold tracking-tight text-slate-900">
        Create an account
      </h1>

      <p class="mt-2 text-sm text-slate-500">
        Get started by creating your account
      </p>
    </div>

    <!-- Card -->
    <div class="rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
      <form class="space-y-5">

        <!-- Name -->
        <div>
          <label for="name" class="mb-2 block text-sm font-medium text-slate-700">
            Full name
          </label>

          <input id="name" type="text" placeholder="John Doe" class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-sm
               text-slate-900 placeholder:text-slate-400
               outline-none transition
               focus:border-green-500 focus:ring-2 focus:ring-green-500/20" />
        </div>

        <!-- Email -->
        <div>
          <label for="email" class="mb-2 block text-sm font-medium text-slate-700">
            Email
          </label>

          <input id="email" type="email" placeholder="you@example.com" class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-sm
               text-slate-900 placeholder:text-slate-400
               outline-none transition
               focus:border-green-500 focus:ring-2 focus:ring-green-500/20" />
        </div>

        <!-- Password -->
        <div>
          <label for="password" class="mb-2 block text-sm font-medium text-slate-700">
            Password
          </label>

          <input id="password" type="password" placeholder="••••••••" class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-sm
               text-slate-900 placeholder:text-slate-400
               outline-none transition
               focus:border-green-500 focus:ring-2 focus:ring-green-500/20" />
        </div>

        <!-- Confirm Password -->
        <div>
          <label for="confirmPassword" class="mb-2 block text-sm font-medium text-slate-700">
            Confirm password
          </label>

          <input id="confirmPassword" type="password" placeholder="••••••••" class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-sm
               text-slate-900 placeholder:text-slate-400
               outline-none transition
               focus:border-green-500 focus:ring-2 focus:ring-green-500/20" />
        </div>

        <!-- Submit -->
        <button type="button" (click)="register()" class="w-full rounded-lg bg-green-600 px-4 py-2.5
             text-sm font-semibold text-white
             transition hover:bg-green-700
             focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2">
          Create account
        </button>

      </form>

      <!-- Login -->
      <p class="mt-6 text-center text-sm text-slate-500">
        Already have an account?

        <a routerLink="/login" class="font-medium text-green-600 hover:text-green-700">
          Sign in
        </a>
      </p>
    </div>

  </div>
</div>
